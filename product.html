<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO Meta Tags -->
  <title>KVX Reps — Product Details</title>
  <meta name="description" content="Szczegóły produktu - KVX Reps" />
  <meta name="keywords" content="KVX Reps, replica, product, details, shopping" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#111111" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f4f6;
      --bg-soft: #ffffff;
      --bg-muted: #ebedf0;
      --panel: rgba(255,255,255,0.72);
      --panel-strong: rgba(255,255,255,0.9);
      --text: #0f1115;
      --text-muted: #5f6673;
      --line: rgba(15,17,21,0.08);
      --line-strong: rgba(15,17,21,0.14);
      --accent: #111111;
      --accent-2: #2d2f34;
      --shadow-sm: 0 10px 30px rgba(15,17,21,0.06);
      --shadow-lg: 0 24px 60px rgba(15,17,21,0.14);
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-pill: 999px;
      --container: 1380px;
      --transition: 180ms cubic-bezier(.2,.8,.2,1);
    }

    html[data-theme="dark"] {
      --bg: #0c0d10;
      --bg-soft: #121419;
      --bg-muted: #17191f;
      --panel: rgba(18,20,25,0.72);
      --panel-strong: rgba(18,20,25,0.92);
      --text: #f5f7fb;
      --text-muted: #9aa3b2;
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.14);
      --accent: #ffffff;
      --accent-2: #dfe4ee;
      --shadow-sm: 0 10px 30px rgba(0,0,0,0.28);
      --shadow-lg: 0 24px 60px rgba(0,0,0,0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.75), transparent 28%),
        radial-gradient(circle at top right, rgba(120,120,120,0.08), transparent 28%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
    }

    html[data-theme="dark"] body {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.04), transparent 24%),
        radial-gradient(circle at top right, rgba(255,255,255,0.03), transparent 22%),
        var(--bg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(var(--container), calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: linear-gradient(135deg, #111 0%, #45484f 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
      position: relative;
      overflow: hidden;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.92);
      border-radius: 999px;
    }

    .brand-mark::before {
      width: 18px;
      height: 2px;
      left: 10px;
      top: 13px;
      transform: rotate(45deg);
    }

    .brand-mark::after {
      width: 18px;
      height: 2px;
      left: 10px;
      top: 24px;
      transform: rotate(-45deg);
    }

    .topbar-right,
    .nav-actions,
    .utility-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-link,
    .ghost-btn,
    .icon-btn,
    .lang-btn,
    .btn {
      transition:
        transform var(--transition),
        background var(--transition),
        border-color var(--transition),
        color var(--transition),
        box-shadow var(--transition),
        opacity var(--transition);
    }

    .nav-link {
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 999px;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
      background: var(--bg-soft);
      box-shadow: var(--shadow-sm);
    }

    .lang-switch,
    .theme-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
    }

    .lang-btn {
      border: 0;
      background: transparent;
      color: var(--text-muted);
      min-width: 44px;
      min-height: 38px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--accent);
      color: var(--bg);
      box-shadow: var(--shadow-sm);
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-soft);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:hover,
    .lang-btn:hover,
    .ghost-btn:hover,
    .btn:hover {
      transform: translateY(-2px);
    }

    .main-content {
      padding: 28px 0 70px;
    }

    .product-detail {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 28px;
      align-items: start;
    }

    .product-gallery {
      display: grid;
      gap: 14px;
    }

    .main-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      background: var(--bg-muted);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .main-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumbnail-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      background: var(--bg-muted);
      border: 1px solid var(--line);
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--transition), border-color var(--transition);
    }

    .thumbnail:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .product-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-category {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--bg-muted);
      border: 1px solid var(--line);
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 700;
      width: fit-content;
    }

    .product-title {
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    .product-price {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .product-description {
      color: var(--text-muted);
      line-height: 1.65;
    }

    .product-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }

    .btn {
      min-height: 54px;
      padding: 0 24px;
      border-radius: 999px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 12px 28px rgba(15,17,21,0.16);
    }

    .btn-primary:hover {
      box-shadow: 0 18px 34px rgba(15,17,21,0.22);
    }

    .btn-secondary {
      background: var(--bg-soft);
      color: var(--text);
      border-color: var(--line);
    }

    .btn-favorite {
      background: var(--bg-soft);
      color: var(--text);
      border-color: var(--line);
      min-height: 50px;
    }

    .btn-favorite.active {
      background: rgba(255, 60, 60, 0.12);
      color: #ff3c3c;
      border-color: rgba(255, 60, 60, 0.24);
    }

    .product-meta {
      padding-top: 18px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .meta-row strong {
      color: var(--text);
      font-weight: 700;
    }

    .empty-state {
      border: 1px dashed var(--line-strong);
      border-radius: 28px;
      background: var(--panel-strong);
      padding: 44px 20px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .empty-state h3 {
      margin-bottom: 10px;
      font-size: 1.4rem;
      letter-spacing: -0.03em;
    }

    .footer {
      border-top: 1px solid var(--line);
      padding: 28px 0 42px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 40px;
    }

    @media (max-width: 1080px) {
      .product-detail {
        grid-template-columns: 1fr;
      }

      .product-gallery {
        order: 1;
      }

      .product-info {
        order: 2;
      }
    }

    @media (max-width: 820px) {
      .topbar-inner {
        padding: 12px 0;
        align-items: start;
      }

      .topbar-inner,
      .topbar-right {
        flex-direction: column;
      }

      .topbar-right {
        width: 100%;
        align-items: stretch;
      }

      .nav-actions,
      .utility-actions {
        width: 100%;
        justify-content: space-between;
      }
    }

    @media (max-width: 560px) {
      .container {
        width: min(var(--container), calc(100% - 20px));
      }

      .topbar-inner {
        min-height: auto;
      }

      .nav-actions {
        gap: 6px;
      }

      .nav-link {
        padding: 9px 12px;
        font-size: 0.92rem;
      }

      .btn,
      .ghost-btn {
        width: 100%;
      }

      .thumbnail-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand" aria-label="KVX Reps home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>KVX Reps</span>
      </a>

      <div class="topbar-right">
        <nav class="nav-actions" aria-label="Primary navigation">
          <a class="nav-link" href="index.html">Start</a>
          <a class="nav-link" href="favorites.html">Ulubione</a>
          <a class="nav-link" href="admin.html">Admin</a>
        </nav>

        <div class="utility-actions">
          <div class="lang-switch" aria-label="Language switcher">
            <button class="lang-btn" data-lang="pl">PL</button>
            <button class="lang-btn" data-lang="en">EN</button>
          </div>

          <div class="theme-box">
            <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
              <span id="theme-icon">◐</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div id="product-detail" class="product-detail">
        <div class="empty-state">
          <h3>Loading...</h3>
          <p>Please wait.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 KVX Reps. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data.js"></script>
  <script>
    const translations = {
      pl: {
        navHome: "Start",
        navFavorites: "Ulubione",
        navAdmin: "Admin",
        loading: "Loading...",
        notFound: "Produkt nie znaleziony",
        notFoundText: "Ten produkt nie istnieje lub został usunięty.",
        backToHome: "Wróć do strony głównej",
        buyNow: "Otwórz produkt",
        addToFavorites: "Zapisz do ulubionych",
        removeFromFavorites: "Usuń z ulubionych",
        category: "Kategoria",
        price: "Cena",
        link: "Link"
      },
      en: {
        navHome: "Home",
        navFavorites: "Favorites",
        navAdmin: "Admin",
        loading: "Loading...",
        notFound: "Product not found",
        notFoundText: "This product does not exist or has been removed.",
        backToHome: "Back to homepage",
        buyNow: "Open product",
        addToFavorites: "Save to favorites",
        removeFromFavorites: "Remove from favorites",
        category: "Category",
        price: "Price",
        link: "Link"
      }
    };

    function t(key) {
      const lang = UI.getLang();
      return translations[lang]?.[key] || translations.pl[key] || key;
    }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function priceLabel(price) {
      const n = Number(String(price).replace(",", "."));
      if (Number.isNaN(n)) return `${price} PLN`;
      return `${n.toFixed(0)} PLN`;
    }

    function setTheme() {
      document.documentElement.setAttribute("data-theme", UI.getTheme());
      document.getElementById("theme-icon").textContent = UI.getTheme() === "dark" ? "☼" : "◐";
    }

    function setLanguage() {
      document.documentElement.lang = UI.getLang();
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === UI.getLang());
      });
      document.querySelectorAll('[data-lang-nav="home"]').forEach(el => el.textContent = t("navHome"));
      document.querySelectorAll('[data-lang-nav="favorites"]').forEach(el => el.textContent = t("navFavorites"));
      document.querySelectorAll('[data-lang-nav="admin"]').forEach(el => el.textContent = t("navAdmin"));
    }

    function getProductFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    function renderNotFound() {
      document.getElementById("product-detail").innerHTML = `
        <div class="empty-state">
          <h3>${escapeHtml(t("notFound"))}</h3>
          <p>${escapeHtml(t("notFoundText"))}</p>
          <a href="index.html" class="btn btn-primary" style="margin-top: 18px; min-width: 200px;">
            ${escapeHtml(t("backToHome"))}
          </a>
        </div>
      `;
    }

    function renderProduct(product) {
      const isFavorite = DB.isFavorite(product.id);
      const allImages = [product.image, ...product.qcImages].filter(Boolean);
      const mainImage = allImages[0] || "https://via.placeholder.com/800x800?text=No+Image";
      const thumbnails = allImages.slice(1);

      document.getElementById("product-detail").innerHTML = `
        <div class="product-gallery">
          <div class="main-image">
            <img src="${escapeHtml(mainImage)}" alt="${escapeHtml(product.name)}" id="main-image" />
          </div>

          ${thumbnails.length > 0 ? `
            <div class="thumbnail-grid">
              ${thumbnails.map((img, idx) => `
                <div class="thumbnail" onclick="changeMainImage('${escapeHtml(img)}')">
                  <img src="${escapeHtml(img)}" alt="Thumbnail ${idx + 1}" />
                </div>
              `).join("")}
            </div>
          ` : ""}
        </div>

        <div class="product-info">
          <div class="product-header">
            <span class="product-category">${escapeHtml(product.category)}</span>
            <h1 class="product-title">${escapeHtml(product.name)}</h1>
            <div class="product-price">${escapeHtml(priceLabel(product.price))}</div>
          </div>

          <p class="product-description">
            ${escapeHtml(product.name)} — ${escapeHtml(product.category)}. 
            ${t("price")}: ${escapeHtml(priceLabel(product.price))}. 
            ${t("category")}: ${escapeHtml(product.category)}.
          </p>

          <div class="product-actions">
            <a href="${escapeHtml(product.link)}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
              ${escapeHtml(t("buyNow"))}
            </a>

            <button class="btn btn-favorite ${isFavorite ? "active" : ""}" id="favorite-btn" onclick="toggleFavorite('${escapeHtml(product.id)}')">
              ${isFavorite ? "♥" : "♡"} ${isFavorite ? escapeHtml(t("removeFromFavorites")) : escapeHtml(t("addToFavorites"))}
            </button>

            <a href="index.html" class="btn btn-secondary">
              ${escapeHtml(t("backToHome"))}
            </a>
          </div>

          <div class="product-meta">
            <div class="meta-row">
              <span>${escapeHtml(t("category"))}:</span>
              <strong>${escapeHtml(product.category)}</strong>
            </div>
            <div class="meta-row">
              <span>${escapeHtml(t("price"))}:</span>
              <strong>${escapeHtml(priceLabel(product.price))}</strong>
            </div>
          </div>
        </div>
      `;
    }

    function changeMainImage(src) {
      document.getElementById("main-image").src = src;
    }

    function toggleFavorite(id) {
      const active = DB.toggleFavorite(id);
      const btn = document.getElementById("favorite-btn");
      if (btn) {
        btn.classList.toggle("active", active);
        btn.innerHTML = `${active ? "♥" : "♡"} ${active ? t("removeFromFavorites") : t("addToFavorites")}`;
      }
    }

    async function loadProduct() {
      const productId = getProductFromUrl();
      
      if (!productId) {
        renderNotFound();
        return;
      }

      const allProducts = await DB.getProducts();
      const product = allProducts.find(p => String(p.id) === String(productId));

      if (!product) {
        renderNotFound();
        return;
      }

      renderProduct(product);
    }

    function setupLanguage() {
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          UI.setLang(btn.dataset.lang);
          setLanguage();
          loadProduct();
        });
      });
    }

    function setupTheme() {
      document.getElementById("theme-toggle").addEventListener("click", () => {
        UI.toggleTheme();
        setTheme();
      });
    }

    async function init() {
      setTheme();
      setLanguage();
      setupTheme();
      setupLanguage();
      await loadProduct();
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
