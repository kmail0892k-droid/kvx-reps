  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f4f6;
      --bg-soft: #ffffff;
      --bg-muted: #ebedf0;
      --panel: rgba(255,255,255,0.72);
      --panel-strong: rgba(255,255,255,0.9);
      --text: #0f1115;
      --text-muted: #5f6673;
      --line: rgba(15,17,21,0.08);
      --line-strong: rgba(15,17,21,0.14);
      --accent: #111111;
      --accent-2: #2d2f34;
      --shadow-sm: 0 10px 30px rgba(15,17,21,0.06);
      --shadow-lg: 0 24px 60px rgba(15,17,21,0.14);
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-pill: 999px;
      --container: 1380px;
      --transition: 180ms cubic-bezier(.2,.8,.2,1);
    }

    html[data-theme="dark"] {
      --bg: #0c0d10;
      --bg-soft: #121419;
      --bg-muted: #17191f;
      --panel: rgba(18,20,25,0.72);
      --panel-strong: rgba(18,20,25,0.92);
      --text: #f5f7fb;
      --text-muted: #9aa3b2;
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.14);
      --accent: #ffffff;
      --accent-2: #dfe4ee;
      --shadow-sm: 0 10px 30px rgba(0,0,0,0.28);
      --shadow-lg: 0 24px 60px rgba(0,0,0,0.42);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.75), transparent 28%),
        radial-gradient(circle at top right, rgba(120,120,120,0.08), transparent 28%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
    }

    html[data-theme="dark"] body {
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.04), transparent 24%),
        radial-gradient(circle at top right, rgba(255,255,255,0.03), transparent 22%),
        var(--bg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(var(--container), calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(18px);
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: linear-gradient(135deg, #111 0%, #45484f 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
      position: relative;
      overflow: hidden;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.92);
      border-radius: 999px;
    }

    .brand-mark::before {
      width: 18px;
      height: 2px;
      left: 10px;
      top: 13px;
      transform: rotate(45deg);
    }

    .brand-mark::after {
      width: 18px;
      height: 2px;
      left: 10px;
      top: 24px;
      transform: rotate(-45deg);
    }

    .topbar-right,
    .nav-actions,
    .utility-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-link,
    .ghost-btn,
    .icon-btn,
    .lang-btn,
    .category-btn,
    .btn {
      transition:
        transform var(--transition),
        background var(--transition),
        border-color var(--transition),
        color var(--transition),
        box-shadow var(--transition),
        opacity var(--transition);
    }

    .nav-link {
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 999px;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
      background: var(--bg-soft);
      box-shadow: var(--shadow-sm);
    }

    .lang-switch,
    .theme-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
    }

    .lang-btn {
      border: 0;
      background: transparent;
      color: var(--text-muted);
      min-width: 44px;
      min-height: 38px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--accent);
      color: var(--bg);
      box-shadow: var(--shadow-sm);
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-soft);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:hover,
    .lang-btn:hover,
    .ghost-btn:hover,
    .btn:hover,
    .category-btn:hover {
      transform: translateY(-2px);
    }

    .hero {
      padding: 38px 0 26px;
    }

    .hero-shell {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 32px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.56) 100%);
      box-shadow: var(--shadow-lg);
    }

    html[data-theme="dark"] .hero-shell {
      background:
        linear-gradient(135deg, rgba(20,22,28,0.92) 0%, rgba(17,19,24,0.76) 100%);
    }

    .hero-shell::before {
      content: "";
      position: absolute;
      inset: auto -80px -80px auto;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(17,17,17,0.12), transparent 68%);
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 28px;
      padding: 40px;
      align-items: stretch;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 22px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-strong);
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.55; }
    }

    .hero-title {
      max-width: 11ch;
      font-size: clamp(2.6rem, 6vw, 5.6rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 800;
    }

    .hero-text {
      max-width: 58ch;
      font-size: 1.02rem;
      color: var(--text-muted);
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 50px;
      padding: 0 22px;
      border-radius: 999px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 12px 28px rgba(15,17,21,0.16);
    }

    .btn-primary:hover {
      box-shadow: 0 18px 34px rgba(15,17,21,0.22);
    }

    .btn-secondary {
      background: var(--bg-soft);
      color: var(--text);
      border-color: var(--line);
    }

    .hero-side {
      display: grid;
      gap: 14px;
    }

    .glass-card {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .hero-stat {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }

    .hero-stat strong {
      font-size: 1.8rem;
      letter-spacing: -0.04em;
    }

    .hero-stat span,
    .mini-note,
    .promo-text,
    .section-subtitle,
    .product-meta {
      color: var(--text-muted);
    }

    .promo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 22px;
    }

    .promo-card {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--bg-soft);
      box-shadow: var(--shadow-sm);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .promo-card strong {
      font-size: 1rem;
    }

    .ghost-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      width: fit-content;
      padding: 0 18px;
      border-radius: 999px;
      background: transparent;
      border: 1px solid var(--line-strong);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .main-content {
      padding: 10px 0 70px;
    }

    .toolbar {
      display: flex;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
      margin: 22px 0 18px;
      flex-wrap: wrap;
    }

    .search-wrap {
      flex: 1 1 380px;
      position: relative;
    }

    .search-input {
      width: 100%;
      min-height: 58px;
      padding: 0 56px 0 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel-strong);
      color: var(--text);
      outline: none;
      box-shadow: var(--shadow-sm);
    }

    .search-input:focus {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 4px rgba(120,120,120,0.08), var(--shadow-sm);
    }

    .search-icon {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin: 30px 0 16px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: clamp(1.4rem, 2vw, 2rem);
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    /* Kategorie - poziome przewijanie na mobile */
    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin-bottom: 26px;
      padding-bottom: 4px;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-btn {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg-soft);
      color: var(--text-muted);
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .category-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .product-card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel-strong);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      min-height: 100%;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .product-media {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--bg-muted);
      overflow: hidden;
    }

    .product-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 300ms ease;
      cursor: pointer;
    }

    .product-card:hover .product-media img {
      transform: scale(1.04);
    }

    .favorite-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.88);
      color: #111;
      box-shadow: var(--shadow-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
      backdrop-filter: blur(10px);
    }

    html[data-theme="dark"] .favorite-btn {
      background: rgba(15,17,21,0.8);
      color: #fff;
    }

    .favorite-btn.active {
      transform: scale(1.02);
    }

    .product-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .product-topline {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .product-category {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      background: var(--bg-muted);
      border: 1px solid var(--line);
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .product-title {
      font-size: 1.08rem;
      line-height: 1.28;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .product-price {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .product-actions {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card-btn {
      min-height: 46px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--bg-soft);
      color: var(--text);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
    }

    .card-btn.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .empty-state {
      border: 1px dashed var(--line-strong);
      border-radius: 28px;
      background: var(--panel-strong);
      padding: 44px 20px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .empty-state h3 {
      margin-bottom: 10px;
      font-size: 1.4rem;
      letter-spacing: -0.03em;
    }

    .footer {
      border-top: 1px solid var(--line);
      padding: 28px 0 42px;
      color: var(--text-muted);
      text-align: center;
    }

    .popup-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6,8,12,0.5);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }

    .popup-backdrop.active {
      display: flex;
      animation: fadeIn 220ms ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .popup {
      width: min(720px, 100%);
      border-radius: 30px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transform: translateY(0);
    }

    .popup-inner {
      padding: 28px;
      display: grid;
      gap: 16px;
    }

    .popup-title {
      font-size: clamp(1.7rem, 4vw, 2.6rem);
      line-height: 1.02;
      letter-spacing: -0.05em;
      font-weight: 800;
      max-width: 12ch;
    }

    .popup-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 8px;
    }

    .slide-up {
      animation: slideUp 380ms cubic-bezier(.2,.8,.2,1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 1080px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }

      .hero-title {
        max-width: 14ch;
      }
    }

    @media (max-width: 820px) {
      .topbar-inner {
        padding: 12px 0;
        align-items: start;
      }

      .topbar-inner,
      .topbar-right {
        flex-direction: column;
      }

      .topbar-right {
        width: 100%;
        align-items: stretch;
      }

      .nav-actions,
      .utility-actions {
        width: 100%;
        justify-content: space-between;
      }

      .promo-grid,
      .product-actions {
        grid-template-columns: 1fr;
      }

      .hero-grid {
        padding: 22px;
      }

      .hero-title {
        font-size: clamp(2.15rem, 10vw, 4rem);
      }
    }

    @media (max-width: 560px) {
      .container {
        width: min(var(--container), calc(100% - 20px));
      }

      .topbar-inner {
        min-height: auto;
      }

      .nav-actions {
        gap: 6px;
      }

      .nav-link {
        padding: 9px 12px;
        font-size: 0.92rem;
      }

      .toolbar,
      .section-head,
      .hero-actions,
      .popup-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .btn,
      .ghost-btn,
      .card-btn {
        width: 100%;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }
      
      /* Naprawa przerwy na mobile */
      .toolbar {
        margin: 14px 0 12px;
      }
      
      .search-wrap {
        flex: 1 1 100%;
      }
      
      .section-head {
        margin: 20px 0 12px;
      }
      
      .categories {
        margin-bottom: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="popup-backdrop" id="welcome-popup">
    <div class="popup slide-up">
      <div class="popup-inner">
        <div class="badge">
          <span class="badge-dot"></span>
          <span data-i18n="popupBadge"></span>
        </div>

        <h2 class="popup-title" data-i18n="popupTitle"></h2>
        <p class="promo-text" data-i18n="popupText"></p>

        <div class="popup-actions">
          <a id="popup-discord-link" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer" data-i18n="popupDiscord"></a>
          <a id="popup-kakobuy-link" class="btn btn-secondary" href="#" target="_blank" rel="noopener noreferrer" data-i18n="popupKakobuy"></a>
          <button id="popup-close-btn" class="ghost-btn" data-i18n="popupClose"></button>
        </div>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand" aria-label="KVX Reps home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span data-i18n="brand"></span>
      </a>

      <div class="topbar-right">
        <nav class="nav-actions" aria-label="Primary navigation">
          <a class="nav-link active" href="index.html" data-i18n="navHome"></a>
          <a class="nav-link" href="favorites.html" data-i18n="navFavorites"></a>
          <a class="nav-link" href="admin.html" data-i18n="navAdmin"></a>
        </nav>

        <div class="utility-actions">
          <div class="lang-switch" aria-label="Language switcher">
            <button class="lang-btn" data-lang="pl">PL</button>
            <button class="lang-btn" data-lang="en">EN</button>
          </div>

          <div class="theme-box">
            <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
              <span id="theme-icon">◐</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <div class="hero-shell">
        <div class="hero-grid">
          <div class="hero-copy">
            <div>
              <div class="badge">
                <span class="badge-dot"></span>
                <span data-i18n="heroBadge"></span>
              </div>

              <h1 class="hero-title" data-i18n="heroTitle" style="margin-top:18px;"></h1>
            </div>

            <p class="hero-text" data-i18n="heroText"></p>

            <div class="hero-actions">
              <a href="#products" class="btn btn-primary" data-i18n="heroPrimary"></a>
              <a href="favorites.html" class="btn btn-secondary" data-i18n="heroSecondary"></a>
            </div>
          </div>

          <div class="hero-side">
            <div class="glass-card">
              <div class="hero-stat">
                <div>
                  <div class="mini-note" data-i18n="productsTitle"></div>
                  <strong id="products-count">0</strong>
                </div>
                <div class="mini-note" id="selected-category-label"></div>
              </div>
            </div>

            <div class="glass-card">
              <div class="hero-stat">
                <div>
                  <div class="mini-note" data-i18n="favoritesTitle"></div>
                  <strong id="favorites-count">0</strong>
                </div>
              </div>
            </div>

            <div class="promo-grid">
              <div class="promo-card">
                <strong>Discord</strong>
                <p class="promo-text" data-i18n="promoDiscord"></p>
                <a class="ghost-btn" href="https://discord.gg/Budc8VnFhm" target="_blank" rel="noopener noreferrer">Discord</a>
              </div>

              <div class="promo-card">
                <strong>Kakobuy</strong>
                <p class="promo-text" data-i18n="promoKakobuy"></p>
                <a class="ghost-btn" href="https://ikako.vip/r/kvx20" target="_blank" rel="noopener noreferrer">Kakobuy</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <main class="main-content" id="products">
    <div class="container">
      <div class="toolbar">
        <div class="search-wrap">
          <input id="search-input" class="search-input" type="text" placeholder="Search products..." />
          <span class="search-icon">⌕</span>
        </div>
      </div>

      <div class="section-head">
        <div>
          <div class="section-subtitle" data-i18n="categoriesTitle"></div>
          <h2 class="section-title" data-i18n="productsTitle"></h2>
        </div>
      </div>

      <div class="categories" id="categories"></div>

      <section class="products-grid" id="products-grid" aria-live="polite">
        <div class="empty-state">
          <h3>Loading...</h3>
          <p>Please wait.</p>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p data-i18n="footerText"></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data.js"></script>
  <script>
    let allProducts = [];
    let currentCategory = "All";
    let currentSearch = "";

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function priceLabel(price) {
      const n = Number(String(price).replace(",", "."));
      if (Number.isNaN(n)) return `${price} PLN`;
      return `${n.toFixed(0)} PLN`;
    }

    function getFilteredProducts() {
      return allProducts.filter(product => {
        const matchesCategory = currentCategory === "All" || product.category === currentCategory;
        const q = currentSearch.trim().toLowerCase();
        const matchesSearch =
          !q ||
          product.name.toLowerCase().includes(q) ||
          product.category.toLowerCase().includes(q);

        return matchesCategory && matchesSearch;
      });
    }

    function renderTranslations() {
      document.documentElement.lang = UI.getLang();

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        el.textContent = UI.t(key);
      });

      const searchInput = document.getElementById("search-input");
      if (searchInput) {
        searchInput.placeholder = UI.t("searchPlaceholder");
      }

      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.lang === UI.getLang());
      });
    }

    function renderThemeIcon() {
      const icon = document.getElementById("theme-icon");
      icon.textContent = UI.getTheme() === "dark" ? "☼" : "◐";
    }

    function renderCategories() {
      const container = document.getElementById("categories");
      container.innerHTML = UI.categories.map(category => `
        <button
          class="category-btn ${category === currentCategory ? "active" : ""}"
          data-category="${escapeHtml(category)}"
        >
          ${escapeHtml(category)}
        </button>
      `).join("");

      container.querySelectorAll(".category-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentCategory = btn.dataset.category;
          renderCategories();
          renderProducts();
        });
      });

      document.getElementById("selected-category-label").textContent = currentCategory === "All" ? "" : currentCategory;
    }

    function productCard(product) {
      const favoriteActive = DB.isFavorite(product.id);
      return `
        <article class="product-card">
          <div class="product-media">
            <button
              class="favorite-btn ${favoriteActive ? "active" : ""}"
              data-favorite-id="${product.id}"
              aria-label="${favoriteActive ? UI.t("saved") : UI.t("save")}"
            >
              ${favoriteActive ? "♥" : "♡"}
            </button>

            <img
              src="${escapeHtml(product.image || "https://via.placeholder.com/800x800?text=No+Image")}"
              alt="${escapeHtml(product.name)}"
              loading="lazy"
              onclick="window.location.href='product.html?id=${product.id}'"
              onerror="this.src='https://via.placeholder.com/800x800?text=Image+Error'"
            />
          </div>

          <div class="product-body">
            <div class="product-topline">
              <span class="product-category">${escapeHtml(product.category)}</span>
              <div class="product-price">${escapeHtml(priceLabel(product.price))}</div>
            </div>

            <h3 class="product-title">${escapeHtml(product.name)}</h3>

            <div class="product-actions">
              <a class="card-btn primary" href="${escapeHtml(product.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(UI.t("buyNow"))}</a>
              <button class="card-btn" onclick="window.location.href='product.html?id=${product.id}'">${escapeHtml(UI.t("details"))}</button>
            </div>
          </div>
        </article>
      `;
    }

    function renderProducts() {
      const grid = document.getElementById("products-grid");
      const products = getFilteredProducts();

      document.getElementById("products-count").textContent = String(products.length);
      document.getElementById("favorites-count").textContent = String(DB.getFavorites().length);

      if (!products.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>${escapeHtml(UI.t("emptyTitle"))}</h3>
            <p>${escapeHtml(UI.t("emptyText"))}</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = products.map(productCard).join("");

      grid.querySelectorAll("[data-favorite-id]").forEach(btn => {
        btn.addEventListener("click", () => {
          const active = DB.toggleFavorite(btn.dataset.favoriteId);
          btn.classList.toggle("active", active);
          btn.innerHTML = active ? "♥" : "♡";
          btn.setAttribute("aria-label", active ? UI.t("saved") : UI.t("save"));
          document.getElementById("favorites-count").textContent = String(DB.getFavorites().length);
        });
      });
    }

    async function loadProducts() {
      allProducts = await DB.getProducts();
      renderProducts();
      renderCategories();
    }

    function setupSearch() {
      document.getElementById("search-input").addEventListener("input", (e) => {
        currentSearch = e.target.value || "";
        renderProducts();
      });
    }

    function setupLanguage() {
      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          UI.setLang(btn.dataset.lang);
          renderTranslations();
          renderProducts();
        });
      });
    }

    function setupTheme() {
      UI.setTheme(UI.getTheme());
      renderThemeIcon();

      document.getElementById("theme-toggle").addEventListener("click", () => {
        UI.toggleTheme();
        renderThemeIcon();
      });
    }

    function setupPopup() {
      const popup = document.getElementById("welcome-popup");
      const closeBtn = document.getElementById("popup-close-btn");
      const discordLink = document.getElementById("popup-discord-link");
      const kakobuyLink = document.getElementById("popup-kakobuy-link");

      discordLink.href = APP.discordUrl;
      kakobuyLink.href = APP.kakobuyUrl;

      if (UI.shouldShowPopup()) {
        popup.classList.add("active");
      }

      closeBtn.addEventListener("click", () => {
        UI.closePopupForever();
        popup.classList.remove("active");
      });

      popup.addEventListener("click", (e) => {
        if (e.target === popup) {
          UI.closePopupForever();
          popup.classList.remove("active");
        }
      });
    }

    function setupPromoLinks() {
      document.getElementById("popup-discord-link").href = APP.discordUrl;
      document.getElementById("popup-kakobuy-link").href = APP.kakobuyUrl;
    }

    async function initPage() {
      renderTranslations();
      setupTheme();
      setupLanguage();
      setupSearch();
      setupPopup();
      setupPromoLinks();
      renderCategories();
      await loadProducts();
    }

    document.addEventListener("DOMContentLoaded", initPage);
  </script>
</body>
</html>
